# Everything that runs without Office: types, unit tests, script tests, the Python harness tests, the local vitest
# project (its fixture-free walker-vs-oracle contract cases; the cases that need a private fixture skip themselves), the
# corpus ratchets on the committed corpus (the oracle, the Scene, and the PPTX: its hash, the Open XML validator and the
# structural checks S1-S6, M3 Task 11) and the chromium e2e. PowerPoint tests never run here (pytest skips them without
# --run-powerpoint), and heavy runs (full atlas, the atlas sweep, PowerPoint, four browsers) stay local.
# Private repo: one job, 15 min. harness/test_ci_workflow.py checks the steps rulings M1-R68 and M1-R76 ask for.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: No binary, office or font files outside corpus/generated
        run: node scripts/check-no-binaries.mjs --all

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Script tests
        run: npm run test:scripts

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: harness/requirements-ci.txt

      - name: Harness dependencies (the versions of requirements.lock.txt)
        run: pip install -r harness/requirements-ci.txt

      # The Open XML validator (harness/ooxml): the .NET 8 or newer SDK is on the runner image. The NuGet cache is keyed on
      # the project file. The build is reused by the harness tests below, which include harness/ooxml.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('harness/ooxml/Validator/Validator.csproj') }}

      - name: Open XML validator (build)
        run: python -c "from harness.ooxml.validate import ensure_built; print(ensure_built())"

      # -rs --no-fold-skipped lists every skipped test on a line of its own, with its reason: the PowerPoint tests and
      # the Windows-only ones (ruling M1-R68).
      - name: Harness tests
        run: python -m pytest harness -q -rs --no-fold-skipped

      # Ruling M1-R76: the walker against the PyMuPDF oracle on synthetic pages (patterns, approx clips, rotation,
      # forms and groups, soft masks), which the committed corpus never reaches.
      - name: Local contract tests (fixture-free cases)
        run: npm run test:local
        env:
          DECKBACK_PY: python

      # The validator built above checks every PPTX of the PPTX ratchet.
      - name: Corpus ratchets (oracle, Scene, PPTX hash + validator + S1-S6)
        run: npm run test:corpus
        env:
          DECKBACK_PY: python

      # M2-R32: the browser is cached, keyed on the installed Playwright's version, and installed only on a miss. No
      # --with-deps: apt only added fonts (the runner image has Chromium's libraries), once at 74 kB/s for 7 minutes,
      # and the e2e compares bytes and renders no text.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # CI is set by GitHub Actions: chromium only, without the M0-7 perf spec (apps/web/playwright.config.ts).
      - name: e2e (chromium)
        run: npm run e2e

  # M7 Task 2: the packed `deckback` package on a clean machine. Build, `npm pack`, then in a new folder outside the checkout
  # (a name with a space and Korean) `npx` runs the tarball on the probe deck: its PPTX must hash as the committed value, and
  # the installed package must work again with every network call refused. Nothing is published. The two systems run in
  # parallel with the job above; this job needs no Python, .NET or browser.
  npx-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['24']
        include:
          # the package's `engines` floor (>=22.13): the bundle and the npx run on the oldest Node it promises
          - os: ubuntu-latest
            node: '22.13'
          - os: windows-latest
            node: '22.13'
    name: npx-smoke (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build the CLI
        run: npm run build:cli

      - name: Pack contents (node --test)
        run: node --test scripts/pack-contents.test.mjs

      - name: npx smoke (pack, npx on a clean folder, hash, --version, --help, no network)
        run: node scripts/npx-smoke/run.mjs
