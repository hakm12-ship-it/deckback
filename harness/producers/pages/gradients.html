<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>skia: gradients</title>
<style>
@page { size: 1280px 720px; margin: 0 }
* { box-sizing: border-box }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #fff }
body { padding: 12px 18px; font: 13px/1.2 "Segoe UI", "Malgun Gothic", sans-serif; color: #222 }
h1 { margin: 0 0 8px; font-size: 20px }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 112px; gap: 10px }
.grid > div { position: relative; border-radius: 6px }
.tag { position: absolute; left: 6px; top: 6px; padding: 1px 6px; border-radius: 3px; background: #000c; color: #fff; font-size: 11px }
svg { display: block; margin-top: 8px }
svg text { font: 600 40px "Segoe UI", "Malgun Gothic", sans-serif }

/* linear */
.l1 { background: linear-gradient(90deg, #e63946, #f1fa8c, #1d3557) }
.l2 { background: linear-gradient(135deg, #ff6b6b 0 40%, #4ecdc4 40% 100%) }
.l3 { background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, .85)), #ffb703 }
.l4 { background: repeating-linear-gradient(45deg, #222 0 10px, #eee 10px 20px) }
/* radial */
.r1 { background: radial-gradient(circle at 30% 30%, #fff, #4361ee 55%, #10002b) }
.r2 { background: radial-gradient(ellipse at center, #ffd166, #ef476f) }
.r3 { background: radial-gradient(closest-side, rgba(255, 0, 0, .9), rgba(255, 0, 0, 0)), linear-gradient(90deg, #ddd 50%, #333 50%) }
.r4 { background: repeating-radial-gradient(circle at 50% 50%, #000 0 6px, #fff 6px 12px) }
/* conic */
.c1 { background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red) }
.c2 { background: conic-gradient(from 45deg at 50% 50%, #e63946 0 25%, #f4a261 0 50%, #2a9d8f 0 75%, #264653 0); border-radius: 50% }
.c3 { background: repeating-conic-gradient(#222 0 15deg, #ddd 0 30deg) }
.c4 { border: 8px solid transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #f09, #09f) border-box }
</style>
</head>
<body>
<h1>Gradients</h1>
<div class="grid">
  <div class="l1"><span class="tag">linear 3 stops</span></div>
  <div class="l2"><span class="tag">linear hard stop</span></div>
  <div class="l3"><span class="tag">linear alpha stops</span></div>
  <div class="l4"><span class="tag">repeating linear</span></div>
  <div class="r1"><span class="tag">radial circle</span></div>
  <div class="r2"><span class="tag">radial ellipse</span></div>
  <div class="r3"><span class="tag">radial alpha</span></div>
  <div class="r4"><span class="tag">repeating radial</span></div>
  <div class="c1"><span class="tag">conic</span></div>
  <div class="c2"><span class="tag">conic pie</span></div>
  <div class="c3"><span class="tag">repeating conic</span></div>
  <div class="c4"><span class="tag">gradient border</span></div>
</div>

<svg width="1244" height="236" viewBox="0 0 1244 236">
  <defs>
    <linearGradient id="gUser" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset=".5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#118ab2"/>
    </linearGradient>
    <linearGradient id="gBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7209b7"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="gRad" gradientUnits="userSpaceOnUse" cx="420" cy="140" r="70">
      <stop offset="0" stop-color="#f72585"/>
      <stop offset=".6" stop-color="#ffbe0b"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </radialGradient>
    <linearGradient id="gAlpha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d00000" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#d00000" stop-opacity=".6"/>
      <stop offset="1" stop-color="#d00000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gReflect" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="900" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#06d6a0"/>
      <stop offset="1" stop-color="#073b4c"/>
    </linearGradient>
  </defs>

  <!-- straight line: stroke gradient in user space (an objectBoundingBox gradient on a flat line paints nothing) -->
  <line x1="20" y1="30" x2="300" y2="30" stroke="url(#gUser)" stroke-width="20" stroke-linecap="round"/>
  <!-- curve: stroke gradient in bounding-box units -->
  <path d="M 20 210 C 90 70, 200 220, 300 90" fill="none" stroke="url(#gBox)" stroke-width="16" stroke-linecap="round"/>
  <!-- dashed circle with a radial stroke -->
  <circle cx="420" cy="140" r="70" fill="none" stroke="url(#gRad)" stroke-width="22" stroke-dasharray="34 12"/>
  <!-- rect: miter join, gradient stroke and gradient fill with fill-opacity -->
  <rect x="540" y="40" width="190" height="150" fill="url(#gBox)" fill-opacity=".35" stroke="url(#gUser)" stroke-width="18" stroke-linejoin="miter"/>
  <!-- polyline: round join, alpha stops -->
  <polyline points="770,200 820,60 880,190 940,60 990,190" fill="none" stroke="url(#gAlpha)" stroke-width="22" stroke-linejoin="round" stroke-linecap="butt"/>
  <!-- spreadMethod reflect -->
  <path d="M 860 20 L 1010 20" stroke="url(#gReflect)" stroke-width="24" fill="none"/>
  <!-- text with a gradient stroke and a gradient fill -->
  <text x="1030" y="70" fill="none" stroke="url(#gBox)" stroke-width="2">Stroke</text>
  <text x="1030" y="130" fill="url(#gBox)">한글 Fill</text>
  <text x="1030" y="190" fill="url(#gAlpha)" stroke="#222" stroke-width="1">Both 둘다</text>
</svg>
</body>
</html>
