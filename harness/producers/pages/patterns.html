<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>skia: patterns</title>
<style>
@page { size: 1280px 720px; margin: 0 }
* { box-sizing: border-box }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #fff }
body { padding: 12px 18px; font: 13px/1.25 "Segoe UI", "Malgun Gothic", sans-serif; color: #222 }
h1 { margin: 0 0 4px; font-size: 20px }
h2 { margin: 6px 0 4px; font-size: 12px; font-weight: 600; color: #777 }
svg { display: block }
svg text { font: 800 54px "Segoe UI", "Malgun Gothic", sans-serif }
.bg { display: flex; gap: 12px }
.bg > div { position: relative; width: 196px; height: 110px; border: 1px solid #999 }
.cap { position: absolute; left: 3px; bottom: 3px; padding: 1px 5px; border-radius: 3px; background: #000c; color: #fff; font-size: 11px }
/* the same 16 x 16 PNG (alpha) as a repeating background */
.b1 { background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAjklEQVR42pVTyRGAMAhEh4JSQErwwdtmnFgRpVCAxfjxgRgOdyaPsLsESLJcfYcIWz9DHiexBjFEb9bETM9yNegQNEkEAMBKK7qCyAwO12Yz0ILDcENp2JuBZ/ZirwQEdVBWQRk6Af/wpTMYxdjnFlj1N7LTdQVSbIXtk0YTaEZITlLxWhDzKjn7TJgJMtwQ9xp7yp3LnQAAAABJRU5ErkJggg==") repeat }
.b2 { background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAjklEQVR42pVTyRGAMAhEh4JSQErwwdtmnFgRpVCAxfjxgRgOdyaPsLsESLJcfYcIWz9DHiexBjFEb9bETM9yNegQNEkEAMBKK7qCyAwO12Yz0ILDcENp2JuBZ/ZirwQEdVBWQRk6Af/wpTMYxdjnFlj1N7LTdQVSbIXtk0YTaEZITlLxWhDzKjn7TJgJMtwQ9xp7yp3LnQAAAABJRU5ErkJggg==") repeat; background-size: 48px 48px }
.b3 { background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAjklEQVR42pVTyRGAMAhEh4JSQErwwdtmnFgRpVCAxfjxgRgOdyaPsLsESLJcfYcIWz9DHiexBjFEb9bETM9yNegQNEkEAMBKK7qCyAwO12Yz0ILDcENp2JuBZ/ZirwQEdVBWQRk6Af/wpTMYxdjnFlj1N7LTdQVSbIXtk0YTaEZITlLxWhDzKjn7TJgJMtwQ9xp7yp3LnQAAAABJRU5ErkJggg==") repeat; background-size: 48px 48px; image-rendering: pixelated }
.b4 { background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAjklEQVR42pVTyRGAMAhEh4JSQErwwdtmnFgRpVCAxfjxgRgOdyaPsLsESLJcfYcIWz9DHiexBjFEb9bETM9yNegQNEkEAMBKK7qCyAwO12Yz0ILDcENp2JuBZ/ZirwQEdVBWQRk6Af/wpTMYxdjnFlj1N7LTdQVSbIXtk0YTaEZITlLxWhDzKjn7TJgJMtwQ9xp7yp3LnQAAAABJRU5ErkJggg==") repeat-x; background-size: 40px 40px; background-color: #fff3bf }
.b5 { background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAjklEQVR42pVTyRGAMAhEh4JSQErwwdtmnFgRpVCAxfjxgRgOdyaPsLsESLJcfYcIWz9DHiexBjFEb9bETM9yNegQNEkEAMBKK7qCyAwO12Yz0ILDcENp2JuBZ/ZirwQEdVBWQRk6Af/wpTMYxdjnFlj1N7LTdQVSbIXtk0YTaEZITlLxWhDzKjn7TJgJMtwQ9xp7yp3LnQAAAABJRU5ErkJggg==") round; background-size: 50px 50px; background-color: #d0ebff }
.b6 { background: linear-gradient(135deg, #ffd43b99, #ff6b6b99), url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAjklEQVR42pVTyRGAMAhEh4JSQErwwdtmnFgRpVCAxfjxgRgOdyaPsLsESLJcfYcIWz9DHiexBjFEb9bETM9yNegQNEkEAMBKK7qCyAwO12Yz0ILDcENp2JuBZ/ZirwQEdVBWQRk6Af/wpTMYxdjnFlj1N7LTdQVSbIXtk0YTaEZITlLxWhDzKjn7TJgJMtwQ9xp7yp3LnQAAAABJRU5ErkJggg==") space; background-size: auto, 30px 30px; background-position: 7px 5px }
.cv { display: flex; gap: 14px }
canvas { border: 1px solid #999 }
#cv2 { background: #f1f3f5 }
</style>
</head>
<body>
<h1>Patterns</h1>

<h2>SVG pattern fills</h2>
<svg width="1244" height="250" viewBox="0 0 1244 250">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.5" fill="#e63946"/>
    </pattern>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="12" fill="#1d3557"/>
    </pattern>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#ff006e"/>
    </linearGradient>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#pg)"/>
      <circle cx="20" cy="20" r="10" fill="#fff" fill-opacity=".7"/>
      <path d="M 0 0 L 40 40" stroke="#073b4c" stroke-width="2"/>
    </pattern>
    <pattern id="box" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width=".25" height=".25">
      <rect width=".125" height=".125" fill="#2a9d8f"/>
      <rect x=".125" y=".125" width=".125" height=".125" fill="#e9c46a"/>
    </pattern>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#6a4c93" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="200" height="140" fill="url(#dots)" stroke="#999"/>
  <rect x="222" y="2" width="200" height="140" fill="url(#stripes)" stroke="#999"/>
  <rect x="442" y="2" width="200" height="140" fill="url(#tile)" stroke="#999"/>
  <rect x="662" y="2" width="200" height="140" fill="url(#box)" stroke="#999"/>
  <circle cx="972" cy="72" r="68" fill="url(#grid)" stroke="#6a4c93" stroke-width="2"/>
  <rect x="1070" y="12" width="150" height="120" fill="none" stroke="url(#stripes)" stroke-width="22"/>
  <text x="10" y="215" fill="url(#dots)" stroke="#e63946" stroke-width="1">Pattern 문자</text>
  <text x="330" y="215" fill="url(#tile)">한글 Tile</text>
  <rect x="640" y="168" width="260" height="70" rx="14" fill="url(#stripes)" fill-opacity=".6" stroke="#1d3557" stroke-width="3"/>
  <ellipse cx="1030" cy="204" rx="120" ry="36" fill="url(#tile)" opacity=".8"/>
</svg>

<h2>repeating background image (16 x 16 PNG with alpha)</h2>
<div class="bg">
  <div class="b1"><span class="cap">repeat, 16px</span></div>
  <div class="b2"><span class="cap">size 48px</span></div>
  <div class="b3"><span class="cap">size 48 pixelated</span></div>
  <div class="b4"><span class="cap">repeat-x</span></div>
  <div class="b5"><span class="cap">round</span></div>
  <div class="b6"><span class="cap">space + gradient</span></div>
</div>

<h2>canvas</h2>
<div class="cv">
  <canvas id="cv1" width="400" height="190"></canvas>
  <canvas id="cv2" width="800" height="380" style="width: 400px; height: 190px"></canvas>
</div>
<script>
(function () {
  var g = document.getElementById('cv1').getContext('2d');
  var lg = g.createLinearGradient(0, 0, 400, 0);
  lg.addColorStop(0, '#f72585'); lg.addColorStop(.5, '#ffd60a'); lg.addColorStop(1, '#4361ee');
  g.fillStyle = lg; g.fillRect(0, 0, 400, 190);
  g.globalAlpha = .6; g.fillStyle = '#fff'; g.beginPath(); g.arc(90, 95, 60, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1; g.strokeStyle = '#222'; g.lineWidth = 4; g.setLineDash([10, 6]); g.stroke(); g.setLineDash([]);
  g.font = '700 26px "Malgun Gothic", "Segoe UI", sans-serif'; g.fillStyle = '#111'; g.fillText('캔버스 Canvas', 170, 50);
  g.save(); g.shadowBlur = 12; g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowOffsetY = 6; g.fillStyle = '#06d6a0'; g.fillRect(180, 80, 90, 60); g.restore();
  var tile = document.createElement('canvas'); tile.width = tile.height = 12;
  var t = tile.getContext('2d'); t.fillStyle = '#073b4c'; t.fillRect(0, 0, 6, 6); t.fillRect(6, 6, 6, 6);
  g.fillStyle = g.createPattern(tile, 'repeat'); g.fillRect(290, 80, 90, 90);
  g.beginPath(); g.moveTo(180, 170); g.bezierCurveTo(200, 120, 250, 190, 270, 150); g.lineWidth = 5; g.strokeStyle = '#fff'; g.stroke();
})();
(function () {
  var c = document.getElementById('cv2'), g = c.getContext('2d');
  g.scale(2, 2); /* a 2x backing store, shown at 400 x 190 */
  g.beginPath(); g.moveTo(20, 20); g.lineTo(380, 20); g.lineTo(200, 170); g.closePath();
  g.save(); g.clip();
  var rg = g.createRadialGradient(200, 60, 10, 200, 90, 160);
  rg.addColorStop(0, '#fff'); rg.addColorStop(.4, '#00b4d8'); rg.addColorStop(1, '#03045e');
  g.fillStyle = rg; g.fillRect(0, 0, 400, 190); g.restore();
  g.lineWidth = 6; g.lineJoin = 'round'; g.strokeStyle = 'rgba(230,57,70,.8)'; g.stroke();
  g.font = '800 40px "Segoe UI", sans-serif'; g.lineWidth = 2; g.strokeStyle = '#1d3557'; g.strokeText('Stroke', 20, 120);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#ffbe0b'; g.beginPath(); g.arc(300, 110, 50, 0, Math.PI * 2); g.fill();
})();
</script>
</body>
</html>
